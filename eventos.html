<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos y Asambleas | Distrito 17 Área 15 AA</title>

<style>
:root {
  --azul: #2f3fa0;
  --azul-oscuro: #16256b;
  --dorado: #d5b05a;
  --gris-fondo: #f8f9fa;
  --gris-card: #ffffff;
  --texto-principal: #222222;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--gris-fondo);
  color: var(--texto-principal);
  line-height: 1.6;
}

header {
  background: #fff;
  border-top: 8px solid var(--azul);
  border-bottom: 8px solid var(--azul);
  padding: 15px 0;
}

.nav-container {
  max-width: 1400px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 30px;
}

.logo {
  width: 100px;
  height: auto;
  display: block;
}

.back-link {
  text-decoration: none;
  color: var(--azul);
  font-weight: bold;
  font-size: 1.25rem;
  transition: color 0.3s;
}

.back-link:hover {
  color: var(--azul-oscuro);
}

.search-box {
  display: flex;
  align-items: center;
  gap: 10px;
}

.search-input {
  border: 1px solid #ccc;
  border-radius: 20px;
  padding: 8px 18px;
  font-size: 1rem;
  outline: none;
  width: 220px;
  color: #555;
  transition: border-color 0.3s;
}

.search-input:focus {
  border-color: var(--azul);
}

.search-btn {
  background-color: var(--azul);
  color: white;
  border: none;
  padding: 8px 22px;
  border-radius: 20px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: background-color 0.3s;
}

.search-btn:hover {
  background-color: var(--azul-oscuro);
}

.hero {
  max-width: 1000px;
  margin: 15px auto 10px auto;
  background: linear-gradient(135deg, #e6f0ff 0%, #f0f4ff 100%);
  border: 1px solid #d0dbe8;
  border-radius: 14px;
  text-align: center;
  padding: 15px 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.hero h1 {
  font-size: 1.8rem;
  color: #1a237e;
  margin-bottom: 4px;
}

.hero h2 {
  font-size: 0.95rem;
  font-weight: normal;
  color: #555;
}

.events-wrapper {
  max-width: 1000px;
  margin: 15px auto 40px auto;
  padding: 30px;
  background: var(--gris-card);
  border-radius: 20px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.06);
  border: 1px solid #eaeaea;
}

/* Estilo de fila de evento inspirado en la referencia */
.event-row {
  display: flex;
  align-items: flex-start;
  padding: 24px 0;
  border-bottom: 1px solid #eaeaea;
}

.event-row:last-child {
  border-bottom: none;
}

/* Cajita de fecha tipo bloque */
.event-date-box {
  background: #eef2f7;
  border: 1px solid #d8e2ec;
  border-radius: 4px;
  text-align: center;
  min-width: 75px;
  padding: 8px 4px;
  margin-right: 24px;
  flex-shrink: 0;
}

.date-box-month {
  display: block;
  font-size: 0.75rem;
  font-weight: bold;
  color: #555;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.date-box-day {
  display: block;
  font-size: 1.6rem;
  font-weight: bold;
  color: #111;
  line-height: 1.1;
  margin: 2px 0;
}

.date-box-sub {
  display: block;
  font-size: 0.55rem;
  color: #666;
  text-transform: uppercase;
  line-height: 1.2;
}

/* Contenido del evento */
.event-details {
  flex-grow: 1;
}

.event-title {
  font-size: 1.5rem;
  color: #111;
  font-weight: normal;
  margin-bottom: 6px;
}

.event-meta {
  font-size: 0.9rem;
  color: #555;
  margin-bottom: 4px;
}

.event-links {
  font-size: 0.85rem;
  color: #444;
  margin-bottom: 14px;
}

.event-links a {
  color: var(--azul);
  text-decoration: none;
}

.event-links a:hover {
  text-decoration: underline;
}

/* Botón Ver Evento estilo negro redondeado */
.btn-ver-evento {
  display: inline-block;
  background-color: #000000;
  color: #ffffff;
  padding: 10px 22px;
  border-radius: 30px;
  font-size: 0.85rem;
  font-weight: bold;
  text-decoration: none;
  transition: background-color 0.2s, transform 0.2s;
}

.btn-ver-evento:hover {
  background-color: #333333;
  transform: translateY(-1px);
}

footer {
  background: #111;
  color: white;
  padding: 40px 20px;
  margin-top: 60px;
}

.footer-grid {
  max-width: 1200px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 30px;
}

.footer-grid h3 {
  color: var(--dorado);
  margin-bottom: 10px;
  font-size: 1.1rem;
}

.footer-grid p {
  font-size: 0.95rem;
  font-weight: 400;
  color: #ccc;
  margin-bottom: 6px;
}

@media (max-width: 768px) {
  .nav-container { flex-direction: column; gap: 15px; text-align: center; }
  .header-left { flex-direction: column; gap: 10px; }
  .search-box { width: 100%; justify-content: center; }
  .search-input { width: 60%; }
  .footer-grid { grid-template-columns: 1fr; }
  .hero h1 { font-size: 1.5rem; }
  .event-row { flex-direction: column; gap: 15px; }
  .event-date-box { align-self: flex-start; }
}
</style>
</head>
<body>

<header>
  <div class="nav-container">
    <div class="header-left">
      <a href="index.html">
        <img src="imagenes/logo_aa.png" class="logo" alt="Distrito 17">
      </a>
      <a href="index.html" class="back-link">&larr; Volver al inicio</a>
    </div>
    
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar texto...">
      <button class="search-btn" onclick="buscarEnPagina()">Buscar</button>
    </div>
  </div>
</header>

<section class="hero">
  <h1>Eventos y Asambleas</h1>
  <h2>Próximas actividades actualizadas desde el calendario del distrito</h2>
</section>

<main class="events-wrapper">
  <div id="custom-calendar-container">
    <p style="text-align: center; color: #555; padding: 20px;">Cargando eventos del distrito...</p>
  </div>
</main>

<footer>
  <div class="footer-grid">
    <div>
      <h3>Distrito 17</h3>
      <p>Área 15 - Sur de Florida</p>
    </div>
    <div>
      <h3>Contacto</h3>
      <p>Español: (305) 642-2805</p>
      <p>Inglés: (305) 461-2425</p>
    </div>
    <div>
      <h3>Dirección</h3>
      <p>1770 West Flagler St. #1</p>
      <p>Miami, FL 33135</p>
    </div>
  </div>
</footer>

<script>
function buscarEnPagina() {
  const texto = document.getElementById("searchInput").value;
  if (texto) {
    window.find(texto);
  }
}

// CONEXIÓN CON LA API Y RENDERIZADO IDÉNTICO A LA REFERENCIA
const API_KEY = 'AIzaSyDLrHDgmIGFsEo3tKdRT0TF3qasXdvobWE'; 
const CALENDAR_ID = 'distrito17area15aa@gmail.com';
const now = new Date().toISOString();
const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&singleEvents=true&orderBy=startTime&timeMin=${now}`;

fetch(url)
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById('custom-calendar-container');
    container.innerHTML = '';

    if (!data.items || data.items.length === 0) {
      container.innerHTML = '<p style="text-align: center; color: #555; padding: 20px;">No hay eventos próximos programados.</p>';
      return;
    }

    let htmlFinal = '';

    data.items.forEach(item => {
      const fechaInicioStr = item.start.dateTime || item.start.date;
      const fechaObj = new Date(fechaInicioStr);

      // Mes en formato corto (ej: OCT, NOV)
      const mesCorto = fechaObj.toLocaleDateString('es-ES', { month: 'short' }).replace('.', '').toUpperCase();
      const diaNum = fechaObj.getDate();

      // Hora o indicativo de todo el día
      const esTodoElDia = !item.start.dateTime;
      let horarioTexto = esTodoElDia ? 'Todo el día' : fechaObj.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

      // Si tiene fecha de fin y es distinta, podemos mostrar un aviso opcional
      let subTextoFecha = '';
      if (item.end) {
        const fechaFinObj = new Date(item.end.dateTime || item.end.date);
        // Si dura más de un día o similar se puede reflejar, por defecto mostramos la hora o ubicación
      }

      const titulo = item.summary || 'Sin título';
      const enlaceGoogle = item.htmlLink || '#';
      const ubicacion = item.location ? `📍 ${item.location}` : '';

      htmlFinal += `
        <div class="event-row">
          <div class="event-date-box">
            <span class="date-box-month">${mesCorto}</span>
            <span class="date-box-day">${diaNum}</span>
            <span class="date-box-sub">EVENTO</span>
          </div>
          <div class="event-details">
            <h3 class="event-title">${titulo}</h3>
            <div class="event-meta">${horarioTexto} ${ubicacion ? '· ' + ubicacion : ''}</div>
            <div class="event-links">
              <a href="${enlaceGoogle}" target="_blank">Calendario de Google</a> · <a href="${enlaceGoogle}" target="_blank">ICS</a>
            </div>
            <a href="${enlaceGoogle}" target="_blank" class="btn-ver-evento">VER EVENTO &rarr;</a>
          </div>
        </div>
      `;
    });

    container.innerHTML = htmlFinal;
  })
  .catch(error => {
    console.error('Error al cargar los eventos:', error);
    container.innerHTML = '<p style="text-align: center; color: red; padding: 20px;">Error al conectar con Google Calendar. Verifica tu clave de API.</p>';
  });
</script>

</body>
</html>
