<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos y Asambleas | Distrito 17 Área 15 AA</title>

<style>
:root {
  --azul: #2f3fa0;
  --azul-oscuro: #16256b;
  --dorado: #d5b05a;
  --gris-fondo: #f8f9fa;
  --gris-card: #ffffff;
  --texto-principal: #222222;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--gris-fondo);
  color: var(--texto-principal);
  line-height: 1.6;
}

header {
  background: #fff;
  border-top: 8px solid var(--azul);
  border-bottom: 8px solid var(--azul);
  padding: 15px 0;
}

.nav-container {
  max-width: 1400px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}

/* Agrupamos el logo y el enlace a la izquierda */
.header-left {
  display: flex;
  align-items: center;
  gap: 30px;
}

.logo {
  width: 110px;
  height: auto;
  display: block;
}

.back-link {
  text-decoration: none;
  color: var(--azul);
  font-weight: bold;
  font-size: 1.25rem;
  transition: color 0.3s;
}

.back-link:hover {
  color: var(--azul-oscuro);
}

.search-box {
  display: flex;
  align-items: center;
  gap: 10px;
}

.search-input {
  border: 1px solid #ccc;
  border-radius: 20px;
  padding: 8px 18px;
  font-size: 1rem;
  outline: none;
  width: 220px;
  color: #555;
  transition: border-color 0.3s;
}

.search-input:focus {
  border-color: var(--azul);
}

.search-btn {
  background-color: var(--azul);
  color: white;
  border: none;
  padding: 8px 22px;
  border-radius: 20px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: background-color 0.3s;
}

.search-btn:hover {
  background-color: var(--azul-oscuro);
}

/* Zona del título reducida y más compacta */
.hero {
  max-width: 1000px;
  margin: 15px auto 10px auto;
  background: linear-gradient(135deg, #e6f0ff 0%, #f0f4ff 100%);
  border: 1px solid #d0dbe8;
  border-radius: 14px;
  text-align: center;
  padding: 15px 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.hero h1 {
  font-size: 1.8rem;
  color: #1a237e;
  margin-bottom: 4px;
}

.hero h2 {
  font-size: 0.95rem;
  font-weight: normal;
  color: #555;
}

.events-wrapper {
  max-width: 1000px;
  margin: 15px auto 40px auto;
  padding: 20px;
  background: var(--gris-card);
  border-radius: 20px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.06);
  border: 1px solid #eaeaea;
}

#google-events-container iframe {
  border: 0;
  width: 100%;
  height: 600px;
  border-radius: 12px;
}

footer {
  background: #111;
  color: white;
  padding: 40px 20px;
  margin-top: 60px;
}

.footer-grid {
  max-width: 1200px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 30px;
}

.footer-grid h3 {
  color: var(--dorado);
  margin-bottom: 10px;
  font-size: 1.1rem;
}

.footer-grid p {
  font-size: 0.95rem;
  color: #ccc;
  margin-bottom: 6px;
}

@media (max-width: 768px) {
  .nav-container { flex-direction: column; gap: 15px; text-align: center; }
  .header-left { flex-direction: column; gap: 10px; }
  .search-box { width: 100%; justify-content: center; }
  .search-input { width: 60%; }
  .footer-grid { grid-template-columns: 1fr; }
  .hero h1 { font-size: 1.5rem; }
}
</style>
</head>
<body>

<header>
  <div class="nav-container">
    <div class="header-left">
      <a href="index.html">
        <img src="imagenes/logo_aa.png" class="logo" alt="Distrito 17">
      </a>
      <a href="index.html" class="back-link">&larr; Volver al inicio</a>
    </div>
    
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar texto...">
      <button class="search-btn" onclick="buscarEnPagina()">Buscar</button>
    </div>
  </div>
</header>

<section class="hero">
  <h1>Eventos y Asambleas</h1>
  <h2>Próximas actividades actualizadas desde el calendario del distrito</h2>
</section>

<main class="events-wrapper">
  <div id="google-events-container">
    <iframe 
      src="https://calendar.google.com/calendar/embed?src=distrito17area15aa%40gmail.com&ctz=America%2FNew_York&hl=es&mode=AGENDA" 
      scrolling="no">
    </iframe>
  </div>
</main>

<footer>
  <div class="footer-grid">
    <div>
      <h3>Distrito 17</h3>
      <p>Área 15 - Sur de Florida</p>
    </div>
    <div>
      <h3>Contacto</h3>
      <p>Español: (305) 642-2805</p>
      <p>Inglés: (305) 461-2425</p>
    </div>
    <div>
      <h3>Dirección</h3>
      <p>1770 West Flagler St. #1</p>
      <p>Miami, FL 33135</p>
    </div>
  </div>
</footer>

<script>
function buscarEnPagina() {
  const texto = document.getElementById("searchInput").value;
  if (texto) {
    window.find(texto);
  }
}
</script>

</body>
</html>
